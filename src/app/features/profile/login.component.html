<main class="min-h-screen bg-[radial-gradient(circle_at_15%_10%,rgba(124,58,237,0.22),transparent_28rem),radial-gradient(circle_at_85%_15%,rgba(215,154,43,0.22),transparent_24rem),linear-gradient(135deg,#f8fafc_0%,#eef7f3_46%,#fff7ed_100%)] px-4 py-8 dark:bg-[radial-gradient(circle_at_15%_10%,rgba(124,58,237,0.28),transparent_28rem),radial-gradient(circle_at_85%_20%,rgba(215,154,43,0.18),transparent_24rem),linear-gradient(135deg,#101820_0%,#141a2a_58%,#231735_100%)]">
  <section class="mx-auto grid min-h-[calc(100vh-4rem)] max-w-6xl items-center gap-8 lg:grid-cols-[1.05fr_0.95fr]">
    <div class="hidden lg:block">
      <div class="max-w-xl">
        <p class="td-label">TIC Diaspora</p>
        <h1 class="mt-4 text-6xl font-black leading-tight text-ink dark:text-white">TIC Diaspora</h1>
        <p class="mt-5 text-lg leading-8 text-stone-600 dark:text-stone-300">
          Présences, bénéficiaires, cotisations, pénalités et décisions dans un espace unique.
        </p>
      </div>
    </div>

    <section class="rounded-lg border border-white/70 bg-white/90 p-6 shadow-2xl shadow-stone-300/50 backdrop-blur dark:border-white/10 dark:bg-white/[0.08] dark:shadow-black/40">
      <div class="mb-6">
        <span class="inline-flex rounded-full bg-plum/10 px-3 py-1 text-xs font-black uppercase text-plum dark:bg-violet-300/10 dark:text-violet-200">Espace sécurisé</span>
        <h2 class="mt-4 text-3xl font-black text-ink dark:text-white">Connexion</h2>
        <p class="td-page-subtitle">Accédez au tableau de bord TIC Diaspora.</p>
      </div>

      <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <label class="block">
          <span class="td-label">Email</span>
          <input class="td-input mt-1 h-12 border-stone-300 bg-white/95 text-base shadow-inner shadow-stone-100 dark:bg-white/10 dark:shadow-none" type="email" formControlName="email" autocomplete="email">
        </label>
        <label class="block">
          <span class="td-label">Mot de passe</span>
          <input class="td-input mt-1 h-12 border-stone-300 bg-white/95 text-base shadow-inner shadow-stone-100 dark:bg-white/10 dark:shadow-none" type="password" formControlName="password" autocomplete="current-password">
        </label>

        @if (error()) {
          <p class="rounded-md border border-coral/30 bg-coral/10 px-3 py-2 text-sm font-semibold text-coral">{{ error() }}</p>
        }

        <button class="td-button-violet h-12 w-full text-base" type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>

      <div class="mt-6 rounded-lg border border-plum/15 bg-gradient-to-br from-mint/10 via-white to-saffron/15 p-4 text-center dark:border-white/10 dark:from-mint/10 dark:via-white/[0.04] dark:to-plum/15">
        <p class="text-xs font-black uppercase tracking-wide text-plum dark:text-violet-200">TIC Diaspora</p>
        <p class="mt-2 text-sm font-black text-ink dark:text-white">Ensemble bâtissons un avenir meilleur</p>
      </div>
    </section>
  </section>
</main>
